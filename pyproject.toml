[project]
name = "zsbinders"
version = "0.1.0"
description = "Zero-shot classification of protein binders from cofolding metrics, with supervised baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[project.scripts]
zsbinders = "zsbinders.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]
tfm = ["tabicl>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zsbinders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
